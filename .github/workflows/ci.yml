name: ci

on:
  push:
    branches: [main]
    # CRITICAL: without this, Image Updater's write-back commit to
    # gitops/**/kustomization.yaml triggers a build, which pushes an image, which
    # Image Updater picks up, which commits again -- a slow infinite loop that
    # costs money and looks like a haunted repository.
    paths-ignore:
      - "gitops/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes which services actually changed. This always runs and always
  # reports, so a PR touching only docs still satisfies a required status check
  # -- which a workflow-level path filter would not, since a skipped workflow
  # reports nothing and the PR waits forever.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      # Tags are computed ONCE here and shared by every matrix job.
      #
      # They used to be computed inside each build job, so two parallel jobs ran
      # `date -u` independently and one commit produced
      # dev-...135032Z-eeb5c3b for one service and dev-...135033Z-eeb5c3b for the
      # other. One second apart, so it usually looked fine -- and it silently
      # broke promoting both services as a unit, because no single tag named the
      # build. A tag must identify a BUILD, not a job.
      owner: ${{ steps.tag.outputs.owner }}
      sha: ${{ steps.tag.outputs.sha }}
      dev_tag: ${{ steps.tag.outputs.dev_tag }}
      pr_tag: ${{ steps.tag.outputs.pr_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          # GHCR requires a lowercase namespace.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # On a pull_request event, actions/checkout checks out the MERGE commit,
          # so `git rev-parse HEAD` is NOT the PR head. The preview ApplicationSet
          # derives its image tag from the PR head SHA, so using HEAD here would
          # produce a tag no preview ever looks for.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)"
          else
            sha="$(git rev-parse --short=7 HEAD)"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Fixed-width UTC timestamp so LEXICAL order == chronological order.
          # Image Updater's `alphabetical` strategy sorts tags as strings and takes
          # the last, so a monotonic counter would break at 9 -> 10 while this
          # cannot.
          echo "dev_tag=dev-$(date -u +%Y%m%dT%H%M%SZ)-${sha}" >> "$GITHUB_OUTPUT"
          # PR previews key on the head short SHA alone -- no timestamp, because
          # the preview ApplicationSet must derive the identical string from the
          # commit. Deliberately NOT dev-prefixed, so Image Updater's dev regex
          # can never roll an unreviewed PR build into the dev environment.
          echo "pr_tag=pr-${sha}" >> "$GITHUB_OUTPUT"

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch -q origin "${{ github.base_ref }}"
            changed="$(git diff --name-only "${base}...HEAD")"
          else
            before="${{ github.event.before }}"
            # All-zeros means a new branch with no diff base; build everything.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed="$(git ls-files)"
            else
              changed="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
          fi

          # A PR asking for a preview needs the WHOLE stack at one tag.
          #
          # Path filtering and preview completeness are in direct tension: the
          # filter exists so touching one service does not rebuild the other, but
          # the preview ApplicationSet pins BOTH services to pr-<sha>, so a
          # service that was not rebuilt has no image at that tag and the preview
          # comes up half-broken with ImagePullBackOff.
          #
          # So: previews build everything, everything else stays filtered. The
          # cost is one redundant build of an unchanged service, which the layer
          # cache makes nearly free.
          wants_preview=false
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             printf '%s' '${{ toJSON(github.event.pull_request.labels.*.name) }}' | jq -e 'index("preview")' >/dev/null 2>&1; then
            wants_preview=true
          fi

          svcs=()
          for s in api-service inventory-service; do
            if [ "$wants_preview" = "true" ] \
               || grep -qE "^(apps/${s}/|\.github/workflows/ci\.yml)" <<<"$changed"; then
              svcs+=("$s")
            fi
          done
          [ "$wants_preview" = "true" ] && echo "preview requested -> building the full stack" >> "$GITHUB_STEP_SUMMARY"

          json="$(printf '%s\n' "${svcs[@]+"${svcs[@]}"}" | grep -v '^$' | jq -R . | jq -sc .)"
          echo "services=${json}" >> "$GITHUB_OUTPUT"
          echo "building: ${json}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the only elevation, required to push to GHCR
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/${{ matrix.service }}/go.mod
          # Per-service cache key, so changing one service does not invalidate
          # the other's module cache.
          cache-dependency-path: apps/${{ matrix.service }}/go.sum

      - name: gofmt and vet
        working-directory: apps/${{ matrix.service }}
        run: |
          set -euo pipefail
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt found unformatted files:"; gofmt -l .; exit 1
          fi
          go vet ./...

      - name: test
        working-directory: apps/${{ matrix.service }}
        run: |
          set -euo pipefail
          go test ./... -race -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      # Pushes on PRs too, so opening a pull request produces a previewable
      # image. Safe here because trunk-based development keeps branches in this
      # repository: a fork PR would not receive packages:write, and its build
      # would fail at this step rather than silently pushing.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          # linux/arm64 is MANDATORY -- the colima clusters are aarch64 and an
          # amd64-only image fails with `exec format error` on every pod.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: >-
            ${{ github.event_name == 'pull_request'
                && format('ghcr.io/{0}/{1}:{2}', needs.changes.outputs.owner, matrix.service, needs.changes.outputs.pr_tag)
                || format('ghcr.io/{0}/{1}:{2}', needs.changes.outputs.owner, matrix.service, needs.changes.outputs.dev_tag) }}
          build-args: VERSION=${{ needs.changes.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Keeps the OCI index to exactly the two real platforms; provenance
          # attestations add unknown/unknown entries that confuse tag consumers.
          provenance: false
          sbom: false

      - name: summary
        if: github.event_name == 'push'
        shell: bash
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`${{ needs.changes.outputs.dev_tag }}\` |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
