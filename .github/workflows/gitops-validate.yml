name: gitops-validate

# Every invariant this design relies on is checked here. Without these the
# "conventions" in gitops/README.md are just prose that drifts.
on:
  push:
    branches: [main]
    paths: ["gitops/**", ".github/workflows/gitops-validate.yml"]
  pull_request:
    branches: [main]
    paths: ["gitops/**", ".github/workflows/gitops-validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install kustomize + kubeconform
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: every overlay builds and is valid Kubernetes
        shell: bash
        run: |
          set -uo pipefail
          # Discovered, not hardcoded: an environment or application added
          # tomorrow is gated automatically.
          #
          # Components (kind: Component) are excluded deliberately -- they carry
          # only patches and no resources, so building one standalone fails with
          # "no resource matches strategic merge patch". They are exercised
          # transitively when the overlays that include them are built.
          mapfile -t dirs < <(grep -rLi '^kind:[[:space:]]*Component' \
                                --include=kustomization.yaml -r gitops \
                              | xargs -n1 dirname | sort -u)
          [ "${#dirs[@]}" -gt 0 ] || { echo "::error::no kustomizations found"; exit 1; }

          fail=0
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            if ! out="$(kustomize build "$d" 2>&1)"; then
              echo "::error file=$d/kustomization.yaml::kustomize build failed"
              echo "$out"; fail=1; echo "::endgroup::"; continue
            fi
            printf '%s\n' "$out" | kubeconform -strict -summary \
              -ignore-missing-schemas -kubernetes-version 1.31.0 || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

      - name: the image tag has exactly one owner
        shell: bash
        run: |
          set -euo pipefail
          # Kustomize's ImageTagTransformer runs AFTER patches, so if a patch
          # file also set .image, `images:` would silently win and the patch
          # would become a file that reads as authoritative and does nothing.
          # The invariant is therefore: nothing under envs/ or variants/ may name
          # an image. base/ may -- that is where the untagged application image
          # is declared, and where the PreSync hook Job names its own (unrelated)
          # postgres image.
          fail=0
          while IFS= read -r f; do
            if grep -qE '^\s+image:\s' "$f"; then
              echo "::error file=$f::sets .image in an overlay -- use images[].newTag in that overlay's kustomization.yaml instead"
              fail=1
            fi
          done < <(find gitops/apps \( -path '*/envs/*' -o -path '*/variants/*' \) -name '*.yaml')
          exit "$fail"

      - name: every environment overlay pins a tag, and it belongs to that environment
        shell: bash
        run: |
          set -euo pipefail
          # The tag is not just a string CI checks for presence: promote.yml and
          # rollback.yml RESOLVE from these files, treating them as the record of
          # what each environment runs. That only holds if the value in
          # envs/<env>/ is genuinely an <env> tag -- a staging tag sitting in the
          # prod overlay would resolve, validate, and promote the wrong artifact.
          # Enforce the grammar here, at the one place that owns it.
          fail=0
          for k in gitops/apps/*/envs/*/kustomization.yaml; do
            env="$(basename "$(dirname "$k")")"
            tag="$(sed -n 's/^[[:space:]]*newTag:[[:space:]]*//p' "$k" | head -1)"
            if [ -z "$tag" ]; then
              echo "::error file=$k::no images[].newTag -- Image Updater would have nothing to write to"
              fail=1
              continue
            fi
            # <env>-<UTC timestamp>-<7-char sha>. The never-promoted placeholder
            # (all zeroes) satisfies this deliberately, so a service awaiting its
            # first promotion does not fail the build.
            if [[ ! "$tag" =~ ^${env}-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7}$ ]]; then
              echo "::error file=$k::newTag '$tag' is not a well-formed '${env}' tag -- promotion resolves from this file and would move the wrong image"
              fail=1
            fi
          done
          exit "$fail"

      - name: platform JSON agrees with its directory
        shell: bash
        run: |
          set -euo pipefail
          # appName is redundant with path segment 2 on purpose (it makes the
          # generated Application name readable without segment arithmetic), so
          # assert the two can never drift apart.
          fail=0
          for j in gitops/platform/*/envs/*/*.json; do
            want="$(basename "$(dirname "$(dirname "$(dirname "$j")")")")"
            got="$(jq -r .appName "$j")"
            [ "$want" = "$got" ] || {
              echo "::error file=$j::appName is '$got' but the directory says '$want'"; fail=1; }
            jq -e .namespace "$j" >/dev/null || {
              echo "::error file=$j::missing 'namespace'"; fail=1; }
          done
          exit "$fail"

      - name: applicationsets parse and keep production ungoverned by Image Updater
        shell: bash
        run: |
          set -euo pipefail
          # templatePatch is an opaque string that neither the CRD schema nor
          # kubectl validates, so a quoting mistake in the allow-tags regex would
          # only surface as a broken Application inside the cluster.
          python3 -m pip install --quiet pyyaml
          fail=0
          for f in gitops/appsets/*.yaml; do
            python3 -c "import sys,yaml;list(yaml.safe_load_all(open(sys.argv[1])))" "$f" \
              || { echo "::error file=$f::not valid YAML"; fail=1; }
          done

          # THE production safety boundary, and since prod became auto-synced it
          # is the only one. Previously manual sync was a second backstop: even
          # if Image Updater had written a tag into the prod overlay, a human
          # still had to press Sync. Now a write-back would deploy itself, so
          # this check carries the whole weight.
          #
          # Structural, not a substring search: every image-updater reference
          # must sit INSIDE the `ne $env "prod"` branch. Moving one after the
          # {{- else }} would still satisfy a plain grep while handing prod to
          # the controller.
          python3 - <<'PY' || fail=1
          import re, sys
          src = open("gitops/appsets/apps-applicationset.yaml").read().splitlines()
          start = end = None
          for i, line in enumerate(src):
              if re.search(r'\{\{-?\s*if ne \$env "prod"', line):
                  start = i
              elif start is not None and end is None and re.search(r'\{\{-?\s*else\s*-?\}\}', line):
                  end = i
          if start is None:
              sys.exit("::error::apps appset no longer excludes prod from Image Updater")
          if end is None:
              sys.exit("::error::could not find the {{- else }} closing the prod exclusion")
          # Comments are skipped: they render into the patch as YAML comments and
          # govern nothing, and the else-branch explains the exclusion in prose.
          stray = [i + 1 for i, line in enumerate(src)
                   if "image-updater" in line
                   and not line.lstrip().startswith("#")
                   and not (start < i < end)]
          if stray:
              sys.exit(f"::error::image-updater reference outside the prod exclusion at line(s) {stray} -- prod would be governed by Image Updater AND auto-synced")
          print(f"prod exclusion holds: image-updater confined to lines {start + 2}-{end}")
          PY
          exit "$fail"

      # Parsing YAML is not enough. An ApplicationSet can be perfectly valid YAML
      # and still be rejected by the API server for a misplaced field -- e.g.
      # `pullRequest.labels` instead of `pullRequest.github.labels`, which cost
      # real debugging time here. Validate against the REAL CRD schema.
      - name: validate appsets against the Argo CD CRD schema
        shell: bash
        run: |
          set -euo pipefail
          ARGOCD_VERSION=v3.5.1
          curl -sSfL -o /tmp/appset-crd.yaml \
            "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/crds/applicationset-crd.yaml"
          python3 -m pip install --quiet pyyaml jsonschema

          python3 - <<'PY'
          import glob, sys, yaml
          from jsonschema import Draft7Validator

          crd = yaml.safe_load(open('/tmp/appset-crd.yaml'))
          schema = crd['spec']['versions'][0]['schema']['openAPIV3Schema']

          def strip(node):
              # x-kubernetes-* vendor extensions are not JSON Schema; drop them so
              # the validator only enforces real structure.
              if isinstance(node, dict):
                  node.pop('x-kubernetes-preserve-unknown-fields', None)
                  node.pop('x-kubernetes-int-or-string', None)
                  node.pop('x-kubernetes-list-type', None)
                  node.pop('x-kubernetes-list-map-keys', None)
                  # Reject unknown fields -- the whole point of this check.
                  if node.get('type') == 'object' and 'properties' in node:
                      node.setdefault('additionalProperties', False)
                  for v in list(node.values()):
                      strip(v)
              elif isinstance(node, list):
                  for v in node:
                      strip(v)
          strip(schema)

          fail = False
          for f in sorted(glob.glob('gitops/appsets/*.yaml')):
              for doc in yaml.safe_load_all(open(f)):
                  if not doc or doc.get('kind') != 'ApplicationSet':
                      continue
                  # templatePatch is a free-form string rendered later; its Go
                  # template braces are not valid YAML on their own.
                  for err in Draft7Validator(schema).iter_errors(doc):
                      path = '.'.join(str(p) for p in err.absolute_path)
                      print(f"::error file={f}::{path}: {err.message[:300]}")
                      fail = True
          sys.exit(1 if fail else 0)
          PY
