name: promote

# Promotion moves an EXISTING artifact between environments by retagging the
# same digest. It never rebuilds.
#
# Why that matters: a rebuild from the same commit is not the same artifact.
# Base image tags move, module proxies can serve different bytes, timestamps
# differ. "It passed staging" only means something if production runs the
# identical digest -- and the Trivy result that passed in CI only carries
# forward if the bytes carry forward.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to promote
        type: choice
        options: [api-service, inventory-service, all]
        required: true
      target_env:
        description: Target environment
        type: choice
        options: [staging, prod]
        required: true
      source_tag:
        description: "Override: promote an OLDER tag instead. Leave blank to promote whatever the source environment is running. One service only."
        type: string
        required: false

permissions:
  contents: read

# Promotion is now a two-dropdown click, so two people can trigger one within
# seconds of each other. Serialise per target: concurrent prod runs would race
# the same overlay file and the same promote/<svc>-<tag> branch name.
concurrency:
  group: promote-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  # Validation runs OUTSIDE the protected environment so a reviewer is never
  # asked to approve a request that was malformed to begin with.
  plan:
    name: validate the request
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.p.outputs.services }}
      owner: ${{ steps.p.outputs.owner }}
      source_env: ${{ steps.p.outputs.source_env }}
    steps:
      - uses: actions/checkout@v4

      - id: p
        shell: bash
        env:
          SRC: ${{ inputs.source_tag }}
          TGT: ${{ inputs.target_env }}
          SVC: ${{ inputs.service }}
        run: |
          set -euo pipefail
          # Enforce the ladder: you cannot jump dev -> prod.
          case "$TGT" in
            staging) SRC_ENV=dev ;;
            prod)    SRC_ENV=staging ;;
            *) echo "::error::unsupported target '$TGT'"; exit 1 ;;
          esac

          if [ "$SVC" = "all" ]; then
            SERVICES=(api-service inventory-service)
          else
            SERVICES=("$SVC")
          fi

          # An explicit tag names ONE artifact, so it cannot be applied across a
          # fan-out. Before per-service resolution this was silently wrong:
          # 'all' sent api-service's tag to the inventory-service leg, and the
          # two services genuinely differ (they are built independently, so a
          # merge touching one does not move the other).
          if [ -n "$SRC" ] && [ "$SVC" = "all" ]; then
            echo "::error::source_tag names a single artifact, so it cannot be combined with service='all'. Promote one service, or leave source_tag blank to resolve each service independently."
            exit 1
          fi

          # Build the matrix as objects: {service, source_tag}. Each service
          # resolves its own tag from the source environment's overlay, which is
          # the authoritative record of what that environment actually runs --
          # Image Updater writes it there.
          entries=()
          for svc in "${SERVICES[@]}"; do
            if [ -n "$SRC" ]; then
              tag="$SRC"
              running="$(./scripts/image-tag.sh current "$svc" "$SRC_ENV")"
              if [ "$tag" != "$running" ]; then
                echo "::warning::override in use: promoting '${tag}' but ${SRC_ENV} is currently running '${running}'"
              fi
            else
              tag="$(./scripts/image-tag.sh current "$svc" "$SRC_ENV")"
              echo "resolved ${svc}: ${SRC_ENV} is running ${tag}"
            fi
            # Shape + ladder + placeholder, on the RESOLVED tag. Validation is
            # not weakened by resolution; it is applied to what will actually
            # be promoted.
            ./scripts/image-tag.sh validate "$tag" "$SRC_ENV"
            entries+=("$(printf '{"service":"%s","source_tag":"%s"}' "$svc" "$tag")")
          done

          printf 'services=[%s]\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "source_env=${SRC_ENV}" >> "$GITHUB_OUTPUT"

          # Show the reviewer exactly what will move, BEFORE the environment
          # gate asks them to approve it.
          {
            echo "### Promotion plan: ${SRC_ENV} -> ${TGT}"
            echo "| service | promoting | resolved from |"
            echo "|---|---|---|"
            for e in "${entries[@]}"; do
              s="$(echo "$e" | python3 -c 'import json,sys; print(json.load(sys.stdin)["service"])')"
              t="$(echo "$e" | python3 -c 'import json,sys; print(json.load(sys.stdin)["source_tag"])')"
              src_desc="\`envs/${SRC_ENV}\` overlay"
              [ -n "$SRC" ] && src_desc="operator override"
              echo "| \`${s}\` | \`${t}\` | ${src_desc} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Promoting to staging only retags the registry; Image Updater then moves
      # the staging overlay on its own schedule. So immediately after a staging
      # promotion the overlay still names the PREVIOUS tag, and a prod promotion
      # resolved from it would quietly promote the older artifact.
      #
      # Resolving what staging has CONVERGED on is the defensible behaviour, so
      # this warns rather than fails -- but it must not be silent.
      - name: warn if the source environment has not converged
        if: inputs.target_env == 'prod' && inputs.source_tag == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.p.outputs.owner }}
          SVCS: ${{ steps.p.outputs.services }}
        run: |
          set -euo pipefail
          echo "$SVCS" | jq -r '.[] | "\(.service) \(.source_tag)"' | while read -r svc pinned; do
            newest="$(gh api --paginate \
              "/users/${OWNER}/packages/container/${svc}/versions" \
              --jq '.[].metadata.container.tags[]?' 2>/dev/null \
              | grep -E '^staging-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7}$' | sort | tail -1 || true)"
            if [ -n "$newest" ] && [ "$newest" != "$pinned" ] && [[ "$newest" > "$pinned" ]]; then
              echo "::warning::${svc}: staging overlay is at '${pinned}' but the registry has newer '${newest}'. Argo CD Image Updater has not converged yet. Wait for its write-back commit, or pass an explicit source_tag."
            fi
          done

  promote:
    name: ${{ matrix.service }} -> ${{ inputs.target_env }}
    needs: plan
    runs-on: ubuntu-latest
    # THE GATE. Configure 'prod' in Settings -> Environments with required
    # reviewers; leave 'staging' unprotected so it promotes immediately. Same
    # job, different policy, enforced by GitHub rather than by this file.
    environment: ${{ inputs.target_env }}
    permissions:
      contents: write # to open the promotion PR for prod
      packages: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # Objects, not bare names: each leg carries the tag resolved for THAT
        # service. The two services are built independently and their tags
        # diverge, so one shared input could never have been correct.
        include: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: retag
        name: retag the same digest
        shell: bash
        env:
          OWNER: ${{ needs.plan.outputs.owner }}
          SVC: ${{ matrix.service }}
          SRC: ${{ matrix.source_tag }}
          TGT: ${{ inputs.target_env }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${OWNER}/${SVC}"

          SRC_DIGEST="$(docker buildx imagetools inspect "${REPO}:${SRC}" --format '{{ .Manifest.Digest }}')"
          echo "source digest: ${SRC_DIGEST}"

          # Prove arm64 is present BEFORE promoting to a cluster that can only
          # run arm64. Catching this here beats catching it as CrashLoopBackOff.
          docker buildx imagetools inspect "${REPO}@${SRC_DIGEST}" --raw \
            | jq -r '.manifests[] | select(.platform.architecture != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' | tee /tmp/plat
          grep -qx 'linux/arm64' /tmp/plat \
            || { echo "::error::${REPO}:${SRC} has no linux/arm64 manifest"; exit 1; }

          SHA_SUFFIX="${SRC##*-}"
          DST_TAG="${TGT}-$(date -u +%Y%m%dT%H%M%SZ)-${SHA_SUFFIX}"

          # Registry-side manifest copy. No layers move; no rebuild.
          docker buildx imagetools create --tag "${REPO}:${DST_TAG}" "${REPO}@${SRC_DIGEST}"

          DST_DIGEST="$(docker buildx imagetools inspect "${REPO}:${DST_TAG}" --format '{{ .Manifest.Digest }}')"
          if [ "${SRC_DIGEST}" != "${DST_DIGEST}" ]; then
            echo "::error::digest changed during retag (${SRC_DIGEST} -> ${DST_DIGEST}); the promoted artifact is NOT bit-identical. Switch this step to 'crane copy'."
            exit 1
          fi
          echo "dst_tag=${DST_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${SRC_DIGEST}" >> "$GITHUB_OUTPUT"

      # staging is watched by Image Updater, so the retag alone is enough -- it
      # will notice the new staging- tag and write it back to git itself.
      # prod is NOT watched by anything, deliberately, so the tag has to be moved
      # in git explicitly. That is done as a pull request: for production, the
      # merge button is the deploy button.
      - name: open the production promotion PR
        if: inputs.target_env == 'prod'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ needs.plan.outputs.owner }}
          SVC: ${{ matrix.service }}
          DST_TAG: ${{ steps.retag.outputs.dst_tag }}
          DIGEST: ${{ steps.retag.outputs.digest }}
          SRC: ${{ matrix.source_tag }}
        run: |
          set -euo pipefail
          BRANCH="promote/${SVC}-${DST_TAG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          OVERLAY="gitops/apps/${SVC}/envs/prod"

          # One writer for category 1. The same helper that READ the source tag
          # writes the target one, so the two can never disagree about which
          # field is authoritative. It edits a single line and preserves
          # comments -- a promotion PR exists to be reviewed by a human, so its
          # diff must not be buried in reformatting.
          ./scripts/image-tag.sh set "$SVC" prod "$DST_TAG"

          # Category 4 travels WITH the version: a promotion is atomically "this
          # image plus the business settings it was validated with".
          cp "gitops/apps/${SVC}/envs/staging/settings.yaml" "${OVERLAY}/settings.yaml"

          git add "$OVERLAY"
          git commit -m "promote(${SVC}): ${DST_TAG} to prod

          Retagged from ${SRC}
          Digest ${DIGEST} (unchanged -- same bytes as staging)"
          git push -u origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "promote(${SVC}): ${DST_TAG} to prod" \
            --body "Promotes the **same digest** already running in staging.

          | field | value |
          |---|---|
          | service | \`${SVC}\` |
          | from | \`${SRC}\` |
          | to | \`${DST_TAG}\` |
          | digest | \`${DIGEST}\` |

          No rebuild occurred. Merging moves the prod overlay; production sync is
          manual by design, so this PR merging does not by itself deploy."

      - name: summary
        shell: bash
        run: |
          {
            echo "### ${{ matrix.service }} promoted to ${{ inputs.target_env }}"
            echo "| field | value |"
            echo "|---|---|"
            echo "| from | \`${{ matrix.source_tag }}\` (${{ needs.plan.outputs.source_env }}) |"
            echo "| to | \`${{ steps.retag.outputs.dst_tag }}\` |"
            echo "| digest | \`${{ steps.retag.outputs.digest }}\` (unchanged) |"
            echo "| approved by | \`${{ github.actor }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
