name: rollback

# ROLLBACK IS A ROLL FORWARD.
#
# `git revert` does NOT roll back dev or staging, and this is the single most
# counterintuitive property of the whole pipeline. The rule those environments
# run on is "the newest allowed tag in the registry wins": Argo CD Image Updater
# polls GHCR, finds the newest tag matching the environment's regex, and writes
# it into git. Revert the commit that bumped the tag and the next poll simply
# writes it straight back -- the revert is undone automatically, and the history
# reads as the tooling fighting the operator, because it is.
#
# So the only durable way to change what is deployed is to make a KNOWN-GOOD
# image the newest one. This workflow retags a previously-good digest under a
# fresh, higher-sorting tag for the same environment. Recovery time is one Image
# Updater interval, the audit trail is forward-only, and it is the same mechanism
# as promotion rather than a second thing to learn.
#
# PRODUCTION does not need this: prod has no Image Updater and syncs manually, so
# `git revert` plus a sync is a true rollback there. That asymmetry is a large
# part of why prod is gated the way it is.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back
        type: choice
        options: [api-service, inventory-service, all]
        required: true
      environment:
        description: Environment to roll back
        type: choice
        options: [dev, staging]
        required: true
      good_tag:
        description: "Override: return to a specific tag. Leave blank to return to the previous tag this environment ran. One service only."
        type: string
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: validate the request
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.p.outputs.services }}
      owner: ${{ steps.p.outputs.owner }}
    steps:
      # fetch-depth: 0 because the ROLLBACK TARGET IS THE HISTORY. The overlay's
      # past revisions are the list of tags this environment has actually run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: p
        shell: bash
        env:
          TAG: ${{ inputs.good_tag }}
          ENVN: ${{ inputs.environment }}
          SVC: ${{ inputs.service }}
        run: |
          set -euo pipefail
          if [ "$SVC" = "all" ]; then
            SERVICES=(api-service inventory-service)
          else
            SERVICES=("$SVC")
          fi

          # A specific tag names ONE artifact; the services roll back
          # independently because they fail independently.
          if [ -n "$TAG" ] && [ "$SVC" = "all" ]; then
            echo "::error::good_tag names a single artifact, so it cannot be combined with service='all'. Roll back one service, or leave good_tag blank to resolve each service's own previous tag."
            exit 1
          fi

          entries=()
          for svc in "${SERVICES[@]}"; do
            if [ -n "$TAG" ]; then
              tag="$TAG"
            else
              tag="$(./scripts/image-tag.sh previous "$svc" "$ENVN")"
              echo "resolved ${svc}: previous ${ENVN} tag is ${tag}"
            fi
            # The replacement must match the environment's own allow-tags regex,
            # or Image Updater will never select it and the rollback silently
            # does nothing.
            ./scripts/image-tag.sh validate "$tag" "$ENVN"
            entries+=("$(printf '{"service":"%s","good_tag":"%s"}' "$svc" "$tag")")
          done

          printf 'services=[%s]\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          # workflow_dispatch cannot populate a dropdown from data, so the next
          # best thing is to print the real candidates: if the previous tag is
          # not far enough back, re-run and paste one of these rather than
          # hunting through GHCR for a tag that may never have been deployed.
          {
            echo "### Rollback plan: ${ENVN}"
            echo "| service | rolling back to |"
            echo "|---|---|"
            for e in "${entries[@]}"; do
              s="$(echo "$e" | python3 -c 'import json,sys; print(json.load(sys.stdin)["service"])')"
              t="$(echo "$e" | python3 -c 'import json,sys; print(json.load(sys.stdin)["good_tag"])')"
              echo "| \`${s}\` | \`${t}\` |"
            done
            echo ""
            for svc in "${SERVICES[@]}"; do
              echo "<details><summary>Tags <code>${svc}</code> has actually run on ${ENVN}</summary>"
              echo ""
              ./scripts/image-tag.sh history "$svc" "$ENVN" 10 | sed 's/^/- `/; s/$/`/'
              echo ""
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: ${{ matrix.service }} -> ${{ matrix.good_tag }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Objects, not bare names: each service resolves its own previous tag,
        # because the services are deployed independently and their histories
        # do not line up.
        include: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: republish the known-good digest as the newest tag
        shell: bash
        env:
          OWNER: ${{ needs.plan.outputs.owner }}
          SVC: ${{ matrix.service }}
          TAG: ${{ matrix.good_tag }}
          ENVN: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${OWNER}/${SVC}"

          DIGEST="$(docker buildx imagetools inspect "${REPO}:${TAG}" --format '{{ .Manifest.Digest }}')"
          echo "known-good digest: ${DIGEST}"

          # Keep the ORIGINAL commit sha in the new tag: the tag must still say
          # which source built this image, or the audit trail lies about what is
          # running. Only the timestamp moves forward.
          SHA_SUFFIX="${TAG##*-}"
          NEW_TAG="${ENVN}-$(date -u +%Y%m%dT%H%M%SZ)-${SHA_SUFFIX}"

          docker buildx imagetools create --tag "${REPO}:${NEW_TAG}" "${REPO}@${DIGEST}"

          NEW_DIGEST="$(docker buildx imagetools inspect "${REPO}:${NEW_TAG}" --format '{{ .Manifest.Digest }}')"
          [ "$DIGEST" = "$NEW_DIGEST" ] || {
            echo "::error::digest changed during retag; the rolled-back artifact is NOT the one that was known good"; exit 1; }

          {
            echo "### ${SVC} rolled back on ${ENVN}"
            echo "| field | value |"
            echo "|---|---|"
            echo "| returned to | \`${TAG}\` |"
            echo "| published as | \`${NEW_TAG}\` |"
            echo "| digest | \`${DIGEST}\` (unchanged) |"
            echo ""
            echo "Image Updater will pick this up within its poll interval and commit it to git."
          } >> "$GITHUB_STEP_SUMMARY"
