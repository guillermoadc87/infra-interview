# AppProjects, not ApplicationSets -- but they live here deliberately.
#
# Putting them inside the root app's single sync is what lets sync-wave -100
# genuinely order them BEFORE the ApplicationSets that reference them, and gives
# them selfHeal. The alternative (a separate directory applied by bootstrap)
# reads more tidily but leaves them unreconciled. The 00- prefix makes the
# ordering obvious to a human scanning the directory.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Cluster platform services -- the things that make a cluster usable
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: platform
    - server: "*"
      namespace: vault
    # External Secrets installs into its own namespace. Without this the
    # Application is rejected before it ever syncs, with "application destination
    # ... do not match any of the allowed destinations in project 'platform'".
    - server: "*"
      namespace: external-secrets
  clusterResourceWhitelist:
    # Required because the appsets use CreateNamespace + managedNamespaceMetadata,
    # which brings the Namespace itself under Argo CD management.
    - group: ""
      kind: Namespace
    # Enumerated rather than wildcarded, so adding a platform component that
    # wants new cluster-level power is a visible, reviewable change.
    #
    # The Vault chart binds its ServiceAccount to system:auth-delegator; the
    # External Secrets chart installs its own CRDs, RBAC and admission webhook.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # The ClusterSecretStore that tells External Secrets where secrets live is
    # cluster-scoped by design: the pr-* namespaces previews create on demand
    # could not be served by a namespaced SecretStore.
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: preview
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Ephemeral per-pull-request preview stacks
  sourceRepos:
    - "*"
  destinations:
    # Previews are confined to their own pr-* namespaces on the dev cluster, so a
    # misconfigured preview cannot write into shop, platform, or another
    # environment.
    - name: dev
      namespace: "pr-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Business applications
  sourceRepos:
    - "*"
  destinations:
    - server: "*"
      namespace: shop
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
