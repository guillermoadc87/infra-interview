# LEVEL 2 of 3 — ephemeral preview environments, one per open pull request.
#
# This is the piece that makes trunk-based development workable: `main` is the
# only long-lived branch, so a developer needs somewhere to exercise a change
# before it merges. Opening a PR creates a complete, isolated stack; closing the
# PR destroys it.
#
# Generator is `pullRequest`, NOT matrix(git x clusters):
#   - the unit of work is a PR, not a directory, so there is nothing to discover
#     in git -- every preview renders the same gitops/preview overlay
#   - previews only ever land on the dev cluster, so there is no label to select on
#
# Everything that differs per PR is injected at the Application level below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pr-previews
  namespace: argocd
  # NO sync-wave, deliberately.
  #
  # This carried `sync-wave: "10"` for tidiness and it deadlocked the root app:
  # wave progression waits for earlier waves to become Healthy, but Argo CD
  # reports NO health status for ApplicationSet resources at all (the field comes
  # back empty), so the later wave waited forever on
  # "waiting for healthy state of argoproj.io/ApplicationSet/platform-helm" and
  # this appset was never created.
  #
  # It also had no business being ordered: a preview brings its own postgres and
  # depends on nothing the platform appsets provide. The wave was pure decoration
  # that bought a false dependency.
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  # Destroy the whole namespace when the PR closes. Without this, previews
  # accumulate silently until a node runs out of memory.
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    - pullRequest:
        github:
          owner: guillermoadc87
          repo: infra-interview
          # Re-uses the Argo CD repository credential; a public repo can be read
          # anonymously but the API is rate-limited hard, which shows up as
          # previews mysteriously not appearing.
          tokenRef:
            secretName: repo-infra-interview
            key: password
          # Previews cost real memory on a laptop-sized cluster, so they are
          # OPT-IN: label a PR `preview` to get one. Remove this to preview
          # every PR.
          #
          # NOTE this is nested under `github`, not under `pullRequest`. Putting
          # it one level up is accepted by every YAML linter and then rejected by
          # the API server with ".spec.generators[0].pullRequest.labels: field
          # not declared in schema" -- label filtering is provider-specific, so
          # it lives with the provider.
          labels:
            - preview
        requeueAfterSeconds: 60

  template:
    metadata:
      name: "preview-{{.branch_slug}}"
      labels:
        app.kubernetes.io/part-of: preview
        env: preview
        pr-number: "{{.number}}"
        branch: "{{.branch_slug}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: preview
      source:
        repoURL: https://github.com/guillermoadc87/infra-interview
        # Previews render the overlay from the PR's OWN head, so a change to the
        # manifests is previewed too -- not just a change to application code.
        targetRevision: "{{.head_sha}}"
        path: gitops/preview
        kustomize:
          # The branch slug suffixes every resource, so a developer working
          # across two PRs can tell the stacks apart at a glance, and any
          # cluster-scoped or cross-namespace reference stays unambiguous. The
          # overlay's `replacements` keeps DB_HOST pointing at the suffixed
          # postgres Service.
          nameSuffix: "-{{.branch_slug}}"
          # Both services at the PR head short SHA -- the exact code under review.
          #
          # Uses the generator's own `head_short_sha_7`, which is exactly the 7
          # characters CI's `cut -c1-7` produces, so the tags line up by
          # construction. Do NOT reach for `slice .head_sha 0 7`: Go template
          # `slice` operates on slices and arrays, not strings, and fails at
          # generation time with "list should be type of slice or array but
          # string" -- which manifests as the appset silently generating zero
          # Applications.
          images:
            - ghcr.io/guillermoadc87/api-service:pr-{{.head_short_sha_7}}
            - ghcr.io/guillermoadc87/inventory-service:pr-{{.head_short_sha_7}}
      destination:
        # Previews always land on dev. `name` (not `server`) so this keeps working
        # if the dev cluster's address changes.
        name: dev
        namespace: "pr-{{.branch_slug}}"
      revisionHistoryLimit: 3
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
