# The one Secret deliberately NOT in git.
#
# This repository is public, so a working database password cannot live in it.
# Everything else about a cluster arrives through Argo CD; this is the single
# out-of-band input, created once per spoke before (or shortly after) the first
# sync. Until it exists, the postgres pod sits in CreateContainerConfigError and
# the applications' PreSync gate blocks -- which is the correct, visible failure
# rather than a silent fallback to a default password.
#
# Create it with:
#   kubectl --context colima-<env> create namespace platform
#   kubectl --context colima-<env> -n platform create secret generic postgres-credentials \
#     --from-literal=username=postgres \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# The production answer is External Secrets / Sealed Secrets / SOPS backed by a
# real secret store -- the Vault instance in this same platform layer is the
# obvious home. That is described in SOLUTION.md as future work; it is NOT
# implemented here, and this file exists so that gap is explicit rather than
# discovered.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: platform
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME
