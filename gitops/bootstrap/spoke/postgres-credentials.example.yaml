# The one Secret deliberately NOT in git.
#
# This repository is public, so a working database password cannot live in it.
# Everything else about a cluster arrives through Argo CD; this is the single
# out-of-band input, created once per spoke before (or shortly after) the first
# sync. Until it exists, the postgres pod sits in CreateContainerConfigError and
# the applications' PreSync gate blocks -- which is the correct, visible failure
# rather than a silent fallback to a default password.
#
# It is needed in BOTH namespaces: `platform`, where Postgres reads it to
# initialise itself, and `shop`, where the applications read it to connect.
# Kubernetes Secrets are namespace-scoped, so there is no way for one object to
# serve both -- a real deployment solves this with External Secrets syncing the
# same backend key into each namespace, rather than by copying.
#
# Create it with:
#   PW="$(openssl rand -base64 24)"
#   for ns in platform shop; do
#     kubectl --context colima-<env> create namespace "$ns" --dry-run=client -o yaml \
#       | kubectl --context colima-<env> apply -f -
#     kubectl --context colima-<env> -n "$ns" create secret generic postgres-credentials \
#       --from-literal=username=postgres --from-literal=password="$PW" \
#       --dry-run=client -o yaml | kubectl --context colima-<env> apply -f -
#   done
#
# The production answer is External Secrets / Sealed Secrets / SOPS backed by a
# real secret store -- the Vault instance in this same platform layer is the
# obvious home. That is described in SOLUTION.md as future work; it is NOT
# implemented here, and this file exists so that gap is explicit rather than
# discovered.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: platform
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME
