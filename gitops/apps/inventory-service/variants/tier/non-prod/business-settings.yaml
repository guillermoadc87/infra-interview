# CONFIG CATEGORY 3 — mostly-static business settings, tier-scoped. NEVER promoted.
# No PAYMENTS_URL here: this service has no payments integration. The tier axis
# carries only what this service actually reads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  template:
    spec:
      containers:
        - name: inventory-service
          env:
            - name: LOG_LEVEL
              value: debug
