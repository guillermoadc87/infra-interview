# CONFIG CATEGORY 3 — environment identity.
#
# Split onto its own axis because a two-valued tier (prod/non-prod) cannot
# express a three-valued fact. Putting it under envs/ instead would place a
# never-promoted value inside the directory that promotion copies FROM, which is
# exactly the mistake this layout exists to prevent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  template:
    spec:
      containers:
        - name: inventory-service
          env:
            - name: ENVIRONMENT
              value: dev
            # CATEGORY 3, and the clearest example of why the category exists.
            #
            # This is an environment's own infrastructure address. It must never
            # travel with a promotion -- shipping dev's collector endpoint to
            # prod would point production telemetry at the wrong cluster -- so it
            # lives here, physically outside envs/, where promotion cannot reach
            # it.
            #
            # Its ABSENCE is also the feature flag. Only dev runs collectors, and
            # pkg/obs treats an unset endpoint as "telemetry disabled" rather
            # than an error, so staging and prod keep working with no telemetry
            # and no connection-refused noise. Promoting the collectors to
            # another environment means adding this one line to that variant.
            # "-collector" is appended by the OpenTelemetry Operator: it names
            # a collector's Service after the custom resource plus that suffix.
            # The collectors used to be plain Helm releases whose Service was
            # just `otel-agent`, so this value changed when they became custom
            # resources -- and a stale name here is silent, because pkg/obs
            # treats an unreachable collector as something to retry rather than
            # an error.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-agent-collector.observability.svc.cluster.local:4317
