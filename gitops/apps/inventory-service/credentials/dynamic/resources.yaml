# DYNAMIC DATABASE CREDENTIALS -- long-lived environments only.
#
# Vault mints a brand new PostgreSQL role for this application, with a 1h TTL,
# and revokes it on expiry. There is no shared database password to rotate, so
# the rotation ordering problem does not exist: there is never a moment when the
# application and the database disagree about a shared secret.
#
# NOT used by previews: a preview runs its OWN throwaway Postgres, and Vault has
# no connection configured to it. Previews keep the static KV credential from
# base/external-secret.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-service-vault
---
# The application authenticates to Vault AS ITSELF, using the ServiceAccount
# above -- not through the External Secrets controller's identity. Vault's
# inventory-service role is bound to this exact ServiceAccount in this exact namespace, and
# its policy allows reading only database/creds/inventory-service. inventory-service therefore cannot
# obtain the other service's database access even if it tried.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: inventory-service-db
spec:
  # A read here GENERATES a credential -- it is not a lookup.
  path: /database/creds/inventory-service
  method: GET
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: inventory-service
        serviceAccountRef:
          name: inventory-service-vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-service-db
spec:
  # Deliberately shorter than the 1h credential TTL, so a fresh lease is issued
  # before the current one expires. Each refresh mints a NEW database user and
  # Reloader rolls the pods onto it -- so the pods restart roughly every 45
  # minutes. That is the real operational cost of dynamic credentials with
  # env-var injection, and it is why a Vault Agent sidecar (which can re-read a
  # credential without a restart) is the usual production choice for
  # high-traffic services.
  refreshInterval: 45m
  target:
    name: inventory-service-db
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: inventory-service-db
