# Argo Rollouts, via workloadRef -- the Deployment stays a Deployment.
#
# THIS IS NOT A STYLE CHOICE. Converting base/deployment.yaml to kind: Rollout
# was the first attempt and it silently destroys this repo's config model.
#
# Kustomize resolves strategic-merge patches using the built-in OpenAPI schema.
# It has no schema for a CRD, so list fields are REPLACED instead of merged by
# key. Measured, not assumed: patching a Rollout with
#
#   containers: [{name: inventory-service, env: [{name: ENVIRONMENT, value: dev}]}]
#
# produced a container with ONLY that env var -- image, ports, probes, resources
# and every other env entry gone. Every file under variants/ and envs/ patches
# the workload, so all of them would have quietly gutted it.
#
# workloadRef sidesteps it entirely: the pod template keeps living on the
# Deployment, where kustomize knows how to merge it, and this object only carries
# rollout STRATEGY. Config category 2 and 3 patches are untouched.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventory-service
spec:
  # spec.replicas is DELIBERATELY ABSENT.
  # Owner: envs/<env>/replicas.yaml (config category 2). If it were set here,
  # every environment would inherit a number that only one of them wants.
  selector:
    matchLabels:
      app: inventory-service
  strategy:
    canary:
      # NO STEPS BY DEFAULT, so this behaves as an ordinary rolling update.
      #
      # Deliberate: prod is a 2-CPU VM running one replica (see
      # envs/prod/replicas.yaml for the deadlock that forced that), and a canary
      # needs at least one extra pod plus enough traffic to judge it. Neither
      # exists there. dev and staging opt in via rollout-strategy.yaml.
      steps: []
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory-service
        image: ghcr.io/guillermoadc87/inventory-service
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        envFrom:
        - configMapRef:
            name: otel-defaults
            optional: true
        env:
        - name: PORT
          value: '8081'
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DB_HOST
          value: postgres.platform.svc.cluster.local
        - name: DB_NAME
          value: inventory
        - name: DB_CRED_DIR
          value: /var/run/secrets/db
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: db-credentials
          mountPath: /var/run/secrets/db
          readOnly: true
      volumes:
      - name: db-credentials
        secret:
          secretName: inventory-service-db
