apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  annotations:
    # Rotation. Without this, rotating the credential in Vault updates the
    # Secret within a minute and the running pods keep serving with the OLD
    # value, because env vars are read once at container start -- so the
    # rotation silently does not take effect.
    #
    # Reloader watches this specific Secret and triggers a normal rolling
    # update when it changes. Named explicitly rather than using
    # `reloader.stakater.com/auto`, so it is obvious from this file which
    # object restarts this workload.
    secret.reloader.stakater.com/reload: "inventory-service-db"
spec:
  # spec.replicas is DELIBERATELY ABSENT.
  # Owner: envs/<env>/replicas.yaml (config category 2). If it were set here,
  # every environment would inherit a number that only one of them wants.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          # UNTAGGED ON PURPOSE. Every overlay supplies images[].newTag.
          # This is what makes Argo CD Image Updater's write-back-target=kustomization
          # work, and it is why `kustomize build base/` alone is not deployable.
          image: ghcr.io/guillermoadc87/inventory-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          # THE CLUSTER-LEVEL TELEMETRY CONTRACT, inherited rather than configured.
          #
          # otel-defaults carries OTEL_EXPORTER_OTLP_ENDPOINT and is owned by
          # gitops/platform/otel-collectors -- the component that also owns the
          # collector it points at. So the endpoint is set once per cluster, and
          # a new service gets it by existing rather than by being configured.
          # It used to be repeated in every variants/env/<env>/env-identity.yaml.
          #
          # optional: true IS LOAD-BEARING. Only clusters running the collectors
          # have this ConfigMap; on staging and prod it is absent, the variable
          # is unset, and pkg/obs treats that as "telemetry disabled". Without
          # `optional` a missing ConfigMap would stop every pod from starting
          # with CreateContainerConfigError -- so that one word is the whole
          # difference between "no telemetry here" and "no application here".
          #
          # Precedence note: an `env` entry below WINS over envFrom on a key
          # collision, so a per-environment override is still possible.
          envFrom:
            - configMapRef:
                name: otel-defaults
                optional: true
          env:
            # --- identical in every environment => belongs in base ---
            - name: PORT
              value: "8081"
            # Pod identity for telemetry, from the downward API.
            #
            # pkg/obs turns these into the k8s.* resource attributes and
            # service.instance.id, which is what makes "which replica served
            # this request" answerable. The agent's k8sattributes processor also
            # enriches by source IP; carrying them here means a pod still
            # identifies itself when that association fails.
            #
            # In base because they are identical in every environment. The
            # collector ENDPOINT is not -- it lives in variants/env/<env>/,
            # config category 3, and is absent where no collector runs.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DB_HOST
              value: postgres.platform.svc.cluster.local
            - name: DB_NAME
              value: inventory
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  # The USERNAME comes from the Secret too, not just the password.
                  # Vault's database engine generates a unique role name per lease
                  # (v-kubernet-inventor-...), so hardcoding `postgres` here meant the
                  # app kept authenticating as the admin user with a dynamic
                  # password and failed with "password authentication failed for
                  # user postgres". Works for the static credential too -- that
                  # Secret carries `username` as well.
                  name: inventory-service-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Materialised from Vault by base/external-secret.yaml.
                  name: inventory-service-db
                  key: password
            # Everything else is environment-scoped and lives elsewhere:
            #   LOW_STOCK_THRESHOLD   -> envs/<env>/settings.yaml         (cat 4, PROMOTED)
            #   LOG_LEVEL             -> variants/tier/<tier>/           (cat 3, never promoted)
            #   ENVIRONMENT           -> variants/env/<env>/              (cat 3, never promoted)
          startupProbe:
            # Covers slow first start (DB connect retry) without a lax livenessProbe.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # /healthz is process liveness ONLY and must never touch the database.
            # If it did, a Postgres blip would restart every pod and turn a
            # dependency outage into an application outage.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            # /readyz DOES check the database: pull the pod out of the Service,
            # but do not kill it. It will re-join when the DB comes back.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Memory limit yes, CPU limit no: a CPU limit here buys nothing and
              # causes throttling under burst. Memory is the one that must be bounded.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
