# Each service gets its OWN Secret, materialised from the same Vault path.
#
# Deliberately NOT a shared `postgres-credentials` in the shop namespace: both
# services deploy there as separate Argo CD Applications, so a shared name would
# mean two Applications owning one resource and fighting over it on every sync --
# the same defect that the duplicated wait-for-postgres Job had.
#
# Per-workload secrets are also the right shape for least privilege: when these
# services eventually need different credentials, only the Vault path changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-service-db
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: api-service-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: postgres
