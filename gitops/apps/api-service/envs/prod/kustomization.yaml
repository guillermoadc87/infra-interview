apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dynamic per-application database credentials from Vault. Replaces the
  # static KV credential that base/ provides for previews.
  - ../../credentials/dynamic
  - pdb.yaml # CATEGORY 2 — a prod-only Kubernetes resource

components:
  - ../../variants/tier/prod
  - ../../variants/env/prod

patches:
  - path: replicas.yaml # CATEGORY 2
  - path: resources.yaml # CATEGORY 2 — prod-only; dev/staging inherit base
  - path: settings.yaml # CATEGORY 4

# CATEGORY 1. Note: prod carries NO Image Updater annotations (see the apps
# ApplicationSet templatePatch), so this value only ever changes via the gated
# promotion workflow.
images:
  - name: ghcr.io/guillermoadc87/api-service
    newTag: prod-20260817T233413Z-638e6b6
