# CONFIG CATEGORY 2 — Kubernetes settings. Never promoted.
# Only prod overrides the base resource envelope; dev and staging inherit it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  template:
    spec:
      containers:
        - name: api-service
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
