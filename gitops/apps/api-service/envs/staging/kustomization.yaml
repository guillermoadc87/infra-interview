apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dynamic per-application database credentials from Vault. Replaces the
  # static KV credential that base/ provides for previews.
  - ../../credentials/dynamic

components:
  - ../../variants/tier/non-prod
  - ../../variants/env/staging

patches:
  - path: replicas.yaml
  # Opts this environment into a canary with automated abort. Absent from prod,
  # which cannot host one -- see base/rollout.yaml.
  - path: rollout-strategy.yaml
  - path: settings.yaml
    target:
      kind: Rollout
      name: api-service

# CATEGORY 1 — see envs/dev/kustomization.yaml for why this is the sole owner.
images:
  - name: ghcr.io/guillermoadc87/api-service
    newTag: staging-20260817T230922Z-638e6b6
