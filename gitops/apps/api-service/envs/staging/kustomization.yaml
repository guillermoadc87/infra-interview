apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Dynamic per-application database credentials from Vault. Replaces the
  # static KV credential that base/ provides for previews.
  - ../../credentials/dynamic

components:
  - ../../variants/tier/non-prod
  - ../../variants/env/staging

patches:
  - path: replicas.yaml
  - path: settings.yaml

