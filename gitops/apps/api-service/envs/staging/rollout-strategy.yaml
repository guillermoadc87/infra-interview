# CONFIG CATEGORY 2 — Kubernetes settings. Never promoted.
#
# Opts this environment into a real canary with automated abort. base/rollout.yaml
# ships NO steps (an ordinary rolling update) because prod cannot host a canary:
# one replica on a 2-CPU node, and not enough traffic to judge one.
#
# `steps` is a LIST, so this patch REPLACES the empty list from base rather than
# merging into it -- which for once is exactly what is wanted. See
# base/rollout.yaml for where that same behaviour is a hazard.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-service
spec:
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        # 25% first, then hold. The pause is what gives the analysis below a
        # window to observe; without it the rollout would complete before any
        # metric existed.
        - setWeight: 25
        - pause: {duration: 60s}
        - setWeight: 50
        - pause: {duration: 60s}
        - setWeight: 100
      # NO `analysis:` BLOCK ON STAGING, deliberately.
      #
      # The collectors and Prometheus are dev-only, so there is no metrics
      # source here -- and an analysis whose provider does not exist does not
      # degrade gracefully, it ERRORS and aborts the rollout. That is exactly
      # what happened on the first deploy, on both services.
      #
      # Staging still gets the canary STEPS, so a bad image is exposed to 25% of
      # traffic behind a 60-second pause rather than all of it at once. What it
      # does not get is automatic abort on a metric, and it should not pretend
      # to: promoting the collectors to staging means adding the analysis block
      # back, in the same commit.
