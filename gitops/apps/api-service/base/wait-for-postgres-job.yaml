# The real cross-Application ordering gate.
#
# Sync waves do NOT order Applications generated by different ApplicationSets --
# waves are scoped to a single Application's sync operation, and the built-in
# health check for an ApplicationSet reports Healthy once it has *generated* its
# Applications, not once those Applications are healthy.
#
# So instead of pretending waves order things across appsets, this PreSync hook
# blocks api-service's sync until Postgres actually accepts connections. On
# timeout the sync fails cleanly and retries under the Application's backoff,
# instead of leaving a CrashLoopBackOff for someone to interpret.
apiVersion: batch/v1
kind: Job
metadata:
  # Named per service: both services deploy into the same namespace, so a
  # shared name would mean two Applications owning one resource and fighting
  # over it on every sync.
  name: api-service-wait-for-postgres
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: postgres:15-alpine
          # DB_HOST is an env var rather than an inline hostname so a PR-preview
          # overlay can point this at its OWN in-namespace postgres. A preview is
          # self-contained; it must not gate on the shared platform database.
          env:
            - name: DB_HOST
              value: postgres.platform.svc.cluster.local
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h "$DB_HOST" -p 5432 -U postgres; do
                echo "waiting for postgres at $DB_HOST..."
                sleep 3
              done
              echo "postgres accepting connections at $DB_HOST"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
