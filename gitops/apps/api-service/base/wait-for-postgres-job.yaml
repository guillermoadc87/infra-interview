# The real cross-Application ordering gate.
#
# Sync waves do NOT order Applications generated by different ApplicationSets --
# waves are scoped to a single Application's sync operation, and the built-in
# health check for an ApplicationSet reports Healthy once it has *generated* its
# Applications, not once those Applications are healthy.
#
# So instead of pretending waves order things across appsets, this PreSync hook
# blocks api-service's sync until Postgres actually accepts connections. On
# timeout the sync fails cleanly and retries under the Application's backoff,
# instead of leaving a CrashLoopBackOff for someone to interpret.
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-postgres
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wait
          image: postgres:15-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h postgres.platform.svc.cluster.local -p 5432 -U postgres; do
                echo "waiting for postgres..."
                sleep 3
              done
              echo "postgres accepting connections"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
