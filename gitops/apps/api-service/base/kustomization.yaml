apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set once here and matched by every Application's destination.namespace.
# Environment identity comes from the CLUSTER, not the namespace -- so namespace
# names are identical on every spoke and no manifest contains the string
# "dev"/"staging"/"prod" anywhere.
namespace: shop

resources:
  - deployment.yaml
  # The pod template stays on the Deployment above; this only carries rollout
  # strategy. See rollout.yaml for the measured reason it is not the other way
  # round.
  - rollout.yaml
  - analysis-template.yaml
  - service.yaml
  # Renders in every environment, including those with no Gateway controller
  # yet. The gateway-api CRDs are installed everywhere so this stays appliable.
  - httproute.yaml
  - wait-for-postgres-job.yaml
  # NOTE: no ExternalSecret here on purpose. Each environment composes the
  # credential MODE it wants -- credentials/dynamic for long-lived
  # environments, credentials/static for previews -- rather than base
  # shipping one and overlays deleting it.

labels:
  - pairs:
      app: api-service
      app.kubernetes.io/name: api-service
      app.kubernetes.io/part-of: shop
    # Safe with the PreSync Job above: kustomize's builtin fieldspec for
    # batch/Job spec/selector/matchLabels is create:false, so it will not
    # fabricate an immutable selector on a Job that doesn't declare one.
    includeSelectors: true
