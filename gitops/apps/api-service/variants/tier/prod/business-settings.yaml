# CONFIG CATEGORY 3 — "mostly static" business settings, tier-scoped.
# See variants/tier/non-prod/business-settings.yaml for the rationale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  template:
    spec:
      containers:
        - name: api-service
          env:
            - name: PAYMENTS_URL
              value: https://payments.example.com
            - name: LOG_LEVEL
              value: info
