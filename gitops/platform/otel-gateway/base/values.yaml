# TIER 2 of 3 -- the per-cluster gateway.
#
#   app SDK  ->  otel-agent (DaemonSet)  ->  THIS  ->  hub backend
#                                              |
#                                              +-> :9090 Prometheus, scraped by
#                                                  Argo Rollouts' analysis
#
# Responsibility: everything that must see the WHOLE CLUSTER at once, which is
# exactly what the agent tier cannot do:
#
#   - tail_sampling. A sampling decision needs every span of a trace in one
#     place. Spans of one trace can be produced on different nodes, so a
#     per-node decision would keep half a trace and drop the other half. This
#     is the structural reason the gateway tier exists.
#   - k8s_cluster metrics. Cluster-level counts come from the API server, so
#     collecting them per node would multiply them by the node count.
#   - one egress point. Redaction and the backend address are configured here,
#     once, instead of on every node.
mode: deployment

# Pin the resource names, as external-secrets does, so the Service DNS name the
# applications and the AnalysisTemplate point at does not depend on the Helm
# release name Argo CD happens to choose. Without it the Service is
# otel-agent-opentelemetry-collector, and every reference to it is a mouthful
# that silently changes if the release is renamed.
fullnameOverride: otel-gateway

# Jaeger and Zipkin receivers are chart defaults. Their PORTS are turned off
# here: nothing in this repo speaks either protocol, and an open port that no
# pipeline reads is surface area with no purpose. The receivers remain defined
# and simply uninstantiated, because the collector only builds what a pipeline
# references.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  # Stays ON: this is the endpoint Argo Rollouts queries, not a debug port.
  prometheus:
    enabled: true
    containerPort: 9090
    servicePort: 9090
    protocol: TCP

replicaCount: 1

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib

presets:
  # k8s_cluster receiver. Safe here precisely because there is one replica.
  clusterMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25

    # Keep everything that matters, sample the rest.
    #
    # The SDK in pkg/obs samples NOTHING away (AlwaysSample) so that this policy
    # set is the only sampling decision in the system. Head sampling in the
    # process would discard errors before they ever reached these rules.
    tail_sampling:
      # How long to hold a trace open waiting for the rest of its spans. Too
      # short and a slow trace is judged on its first span only.
      decision_wait: 5s
      num_traces: 20000
      policies:
        - name: keep-all-errors
          type: status_code
          status_code: {status_codes: [ERROR]}
        - name: keep-slow-traces
          type: latency
          latency: {threshold_ms: 500}
        - name: baseline-sample
          type: probabilistic
          probabilistic: {sampling_percentage: 10}

    # Strips anything that should not leave the cluster. Nothing here produces
    # an Authorization header today; the stage exists so that the place to add a
    # redaction rule is obvious and central, rather than discovered during an
    # incident.
    transform/redact:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - delete_key(attributes, "http.request.header.authorization")
            - delete_key(attributes, "http.request.header.cookie")

  exporters:
    # TIER 3: the viewing backend on the hub, reached over the lima user-v2
    # network at a fixed NodePort.
    #
    # Verified in docs/spike-02-spoke-to-hub.md: a POD on a spoke resolves
    # lima-colima-hub.internal via CoreDNS's upstream and reaches the hub's
    # NodePort range. spike-01 only ever established the hub -> spoke direction,
    # so this was an open question rather than an assumption.
    otlp/hub:
      endpoint: lima-colima-hub.internal:30317
      tls:
        insecure: true
      retry_on_failure:
        enabled: true
      # Bounded, deliberately. If the hub is unreachable the queue fills and
      # telemetry is dropped -- it must never grow until the collector is
      # OOMKilled, because that would take the :9090 endpoint below down with
      # it, and that endpoint is what automated rollback depends on.
      sending_queue:
        enabled: true
        queue_size: 1000

    # THE IMPORTANT ONE. Argo Rollouts' AnalysisTemplate queries this endpoint,
    # IN-CLUSTER, so canary analysis and automatic rollback do not depend on the
    # hub being reachable at all. Only human viewing does.
    #
    # The exporter renames metrics on the way out: the SDK's
    # http.server.request.duration is queried here as
    # http_server_request_duration_seconds_bucket.
    prometheus:
      endpoint: ${env:MY_POD_IP}:9090
      # Without this, resource attributes (service.name, and so the only label
      # that tells one service from another) never reach the Prometheus series.
      resource_to_telemetry_conversion:
        enabled: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, tail_sampling, transform/redact, batch]
        exporters: [otlp/hub]
      metrics:
        # `prometheus` scrapes this collector's own :8888 internal metrics --
        # including tail_sampling's drop counters, which is how you find out the
        # sampler is discarding more than you think.
        receivers: [otlp, k8s_cluster, prometheus]
        processors: [memory_limiter, batch]
        # Both: Prometheus for the rollout decision, the hub for a human.
        exporters: [prometheus, otlp/hub]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/hub]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # Higher than the agent's: tail_sampling holds up to num_traces in memory
    # for decision_wait before deciding.
    memory: 384Mi
