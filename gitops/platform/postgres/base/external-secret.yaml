# Materialises the database credential from Vault instead of a human running
# `kubectl create secret` on every cluster.
#
# The Secret this produces is owned by ESO (creationPolicy: Owner), so deleting
# the ExternalSecret deletes the Secret -- no orphaned credentials left behind.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  # Cheap: Vault is in-cluster. Short enough that a rotation in Vault reaches the
  # cluster quickly, long enough not to hammer the API.
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  # dataFrom/extract copies every key at the path, so `username` and `password`
  # arrive with the same names the Deployment already expects -- no per-key
  # mapping to keep in sync.
  dataFrom:
    - extract:
        key: postgres
