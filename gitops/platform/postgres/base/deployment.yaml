apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  # DELIBERATELY NOT annotated for Reloader.
  #
  # Restarting a database because its credential Secret changed is a dangerous
  # default. POSTGRES_PASSWORD is only read when the data directory is first
  # initialised, so on a real volume a restart would NOT adopt the new password
  # -- it would come back still expecting the old one while every client had
  # already rotated. And here, where the volume is an emptyDir, a restart wipes
  # the database entirely: a credential rotation would become silent data loss.
  #
  # Rotating a database password is a procedure (ALTER USER, then rotate
  # consumers), not a pod restart. The real answer is Vault's database secrets
  # engine issuing short-lived per-application credentials; see SOLUTION.md.
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a second Postgres pod attaching to the same
    # data location is never what you want, even with an emptyDir.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Sourced from a Secret created once per cluster by
            # gitops/bootstrap/spoke/. This is the ONE thing deliberately not in
            # git -- the repo is public.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
        - name: data
          # DELIBERATELY ephemeral, carried over unchanged from the Helm chart.
          #
          # This is a development fixture, not a database. Every restart wipes it
          # and re-runs the init script -- which is the only reason the init
          # script works at all. Adding a PVC would make init a one-shot that
          # then silently stops applying, and an RWO volume under a Deployment
          # deadlocks on upgrade. Persistent storage is Path 1's subject; the
          # GitOps structure is identical whether this is an emptyDir, a
          # StatefulSet, or RDS.
          emptyDir: {}
