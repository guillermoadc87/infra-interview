# The third layer of the observability standard.
#
# pkg/obs sets the standard in CODE: one way to get a tracer, semconv metric
# names, resource attributes assembled in one place. CI enforces the BOUNDARY:
# nothing under apps/ may import go.opentelemetry.io directly. Neither can do
# anything about a workload that simply never points at a collector -- it starts
# fine, serves traffic fine, and is invisible.
#
# This closes that: a pod in `shop` without the OTLP endpoint is a pod nobody
# can see, and the canary analysis that gates a rollout would have no metrics to
# judge. Silence looks identical to health.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-telemetry-contract
  annotations:
    policies.kyverno.io/title: Application pods must be observable
    policies.kyverno.io/category: Observability
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-otlp-endpoint
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
      # PreSync gate Jobs are short-lived and intentionally uninstrumented.
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  batch.kubernetes.io/job-name: "*"
      validate:
        message: >-
          Containers in `shop` must set OTEL_EXPORTER_OTLP_ENDPOINT. pkg/obs
          treats an unset endpoint as "telemetry disabled" -- correct for
          `go test`, wrong for a cluster, and indistinguishable from a healthy
          service that simply never reports.
        pattern:
          spec:
            containers:
              - env:
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "?*"
