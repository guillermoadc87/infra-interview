# A self-signed root, then a CA issuer that chains off it.
#
# Two objects rather than one, because a bare selfSigned issuer gives every
# certificate its OWN unrelated root -- so nothing can ever be trusted by
# anything except itself. The chain here means one CA signs everything in the
# cluster, which is what makes "trust this one bundle" possible later (that is
# what trust-manager distributes, and it is not installed yet).
#
# No ACME / Let's Encrypt issuer. These clusters are colima VMs on a private
# lima network with no public DNS, so neither HTTP-01 nor DNS-01 could ever
# complete a challenge. A self-signed CA is the only honest option locally.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
# The root certificate itself, signed by the issuer above and stored where the
# CA issuer below can read it.
#
# In cert-manager's OWN namespace deliberately: a ClusterIssuer reads its CA
# secret from the namespace cert-manager runs in, NOT from the namespace of the
# Certificate that uses it. Putting this anywhere else produces a ClusterIssuer
# stuck Pending with "secret not found", pointing at the wrong namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: infra-interview-local-ca
  secretName: cluster-ca-key-pair
  duration: 87600h # 10 years -- a local dev root nobody will rotate
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
# The issuer everything else should reference.
#
# The OpenTelemetry Operator points at this through its values
# (admissionWebhooks.certManager.issuerRef), and a future TLS listener on the
# Traefik Gateway would too.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-ca
spec:
  ca:
    secretName: cluster-ca-key-pair
