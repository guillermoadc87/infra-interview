# The reconciler needs to read and write ONE Secret (the unseal keys) in its own
# namespace, and nothing else. It gets a Role, not a ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-config
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
    # Scoped to the unseal-key Secret by name; it cannot read anything else.
    resourceNames: ["vault-unseal-keys"]
  - apiGroups: [""]
    resources: ["secrets"]
    # `create` cannot be restricted by resourceName (the object does not exist
    # yet), so this second rule grants create only.
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-config
subjects:
  - kind: ServiceAccount
    name: vault-config
