apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - rbac.yaml
  - cronjob.yaml
  - cluster-secret-store.yaml

labels:
  - pairs:
      app.kubernetes.io/name: vault-config
      app.kubernetes.io/part-of: platform
    # false: this bundle has no Deployment/Service pair to keep in sync, and a
    # CronJob's jobTemplate selector is generated by the controller.
    includeSelectors: false

configMapGenerator:
  - name: vault-config-scripts
    files:
      - files/reconcile-vault.sh

# The ClusterSecretStore is cluster-scoped, so the namespace transformer above
# must not try to place it. Kustomize knows this from the CRD's scope only if
# told, so it is declared here.
