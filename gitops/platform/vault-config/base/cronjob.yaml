# The reconciler runs on a schedule, not once, because a file-storage Vault comes
# back SEALED after any restart and Argo CD cannot detect that -- the Kubernetes
# resources are unchanged, so selfHeal has nothing to correct.
#
# This converts "a human must notice Vault is sealed and re-seed it" into "the
# platform repairs itself within two minutes".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-config
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  # Do not stampede a backlog of missed runs after the laptop wakes up.
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: vault-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              # curl only. The script uses curl plus shell builtins -- no vault
              # CLI, no kubectl, no jq -- so this image needs nothing installed at
              # runtime. That matters: the first version used alpine + `apk add
              # curl jq`, which requires ROOT, and the pod was crash-looping on a
              # permission error under runAsNonRoot. Dropping the dependency was
              # the right fix; running as root to install a JSON parser was not.
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "/scripts/reconcile-vault.sh"]
              env:
                - name: VAULT_ADDR
                  value: http://vault.vault.svc.cluster.local:8200
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { memory: 96Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: scripts
              configMap:
                name: vault-config-scripts
                defaultMode: 0755
