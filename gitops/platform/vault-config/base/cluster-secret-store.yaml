# The single place that tells External Secrets where secrets come from.
#
# ClusterSecretStore (not SecretStore) so that ANY namespace can consume it --
# including the pr-* namespaces that previews create on demand, which no
# namespace-scoped store could serve.
#
# Note there is no token, password, or key here. ESO authenticates with its own
# ServiceAccount JWT, which Vault verifies against the cluster API. That is the
# whole point of the change: no static credential exists to leak or rotate.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          # ESO mints a token for this ServiceAccount and presents it to Vault.
          # It must match bound_service_account_{names,namespaces} on the Vault
          # role written by reconcile-vault.sh.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
