# Argo Rollouts: the piece that turns a bad deploy into an automatic rollback.
#
# What the repo had before: a failed PostSync hook makes the sync loudly red. It
# does NOT undo anything, and `git revert` cannot help on dev or staging because
# Image Updater finds the bad tag still newest and writes it straight back
# (see .github/workflows/rollback.yml). So "rollback" meant republishing a
# known-good digest under a newer tag -- correct, but entirely human-driven.
#
# A Rollout with an AnalysisTemplate aborts BY ITSELF when the canary's error
# rate or latency regresses, before the change has reached most of the traffic.
#
# INSTALLED IN EVERY ENVIRONMENT, unlike the rest of the new platform layer.
# Not for the controller -- for the CRD. gitops/apps/*/base/ declares a Rollout,
# so every environment that renders that base needs the Rollout CRD to exist or
# the Application fails to sync. The controller is one small pod; the CRD is the
# actual requirement.
fullnameOverride: argo-rollouts

# The CRDs ship with the chart. ServerSideApply is set globally on the platform
# appset, which is what keeps the large Rollout CRD under the client-side
# annotation limit -- the same reason external-secrets needs it.
installCRDs: true

controller:
  replicas: 1

  # LEADER ELECTION OFF, because there is exactly one replica.
  #
  # It was crashlooping: 20 restarts, each a CLEAN exit (code 0, "Exiting Main
  # Run function"), preceded by
  #
  #   failed to renew lease argo-rollouts/argo-rollouts-controller-lock:
  #   context deadline exceeded
  #   error retrieving resource lock ...: client rate limiter Wait returned an
  #   error: context deadline exceeded
  #
  # That is the controller behaving correctly: an instance that cannot prove it
  # still holds leadership must stop acting, so it exits and lets the next one
  # take over. On a single-node k3s whose API server was saturated during the
  # platform rollout, lease renewals missed the default 10s deadline and the
  # controller took itself down repeatedly -- while Rollouts went unreconciled,
  # which is how stale ReplicaSets from an aborted canary were left behind.
  #
  # With replicas: 1 the election protects against nothing: there is no second
  # instance it could be racing. It is pure overhead plus a liveness hazard
  # whose trigger is API latency, which a laptop cluster has plenty of.
  #
  # Raising the timings was the alternative and is the WRONG fix here -- it makes
  # the window bigger without removing the failure mode, and would need revisiting
  # every time the node gets busy. Restore this (and prefer longer deadlines) if
  # the controller is ever scaled above one replica.
  extraArgs:
    - --leader-elect=false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

# The dashboard is a separate deployment and is off: it is a read-only UI, and
# `kubectl argo rollouts get rollout <name> --watch` shows the same progression
# in a terminal for no memory.
dashboard:
  enabled: false
